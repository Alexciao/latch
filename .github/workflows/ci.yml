name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Version comes from "packageManager" in web/package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # UI build, contract check, core tests, self-contained publish and the Velopack installer.
      # CI builds are versioned <Directory.Build.props version>-ci.<run number> so they never look like a release.
      - name: Build, test and package
        shell: pwsh
        run: |
          $base = (Select-Xml -Path Directory.Build.props -XPath "//Version").Node.InnerText
          ./build.ps1 -Version "$base-ci.${{ github.run_number }}"

      - uses: actions/upload-artifact@v7
        with:
          name: latch-installer
          path: artifacts/releases/*Setup.exe
          if-no-files-found: error
          retention-days: 14
